<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roggienin Daşşakları Saolsun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .main-text {
            font-size: 4.5rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 10;
            padding: 20px;
            position: relative;
        }
        
        /* Basit animasyon efekti */
        .main-text span {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            animation-delay: calc(var(--char-index) * 0.1s);
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        /* Arkaplan partikülleri */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 5s infinite linear;
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Responsive tasarım */
        @media (max-width: 768px) {
            .main-text {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 480px) {
            .main-text {
                font-size: 2rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="main-text" id="mainText">Arnisa Sen Malsın 2 - 0 Yendik Hala Ağlıyon</div>
    
    <script>
        // Metni harf harf animasyonlu hale getir
        const mainText = document.getElementById('mainText');
        const textContent = mainText.textContent;
        const particlesContainer = document.getElementById('particles');
        
        // Metni harflere ayır ve her harfe animasyon ekle
        mainText.innerHTML = '';
        for (let i = 0; i < textContent.length; i++) {
            const span = document.createElement('span');
            span.textContent = textContent[i];
            span.style.setProperty('--char-index', i);
            mainText.appendChild(span);
        }
        
        // Partiküller oluştur
        function createParticles() {
            particlesContainer.innerHTML = '';
            
            // 100 partikül oluştur
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Rastgele pozisyon
                particle.style.left = `${Math.random() * 100}%`;
                
                // Rastgele animasyon gecikmesi ve süresi
                const delay = Math.random() * 5;
                const duration = Math.random() * 3 + 3;
                const size = Math.random() * 3 + 2;
                
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Rastgele opaklık
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Sayfa yüklendiğinde partikülleri oluştur
        window.addEventListener('load', createParticles);
        
        // Pencere boyutu değiştiğinde partikülleri yeniden oluştur
        window.addEventListener('resize', createParticles);
        
        // Metin rengini rastgele değiştiren basit bir efekt
        setInterval(() => {
            const hue = Math.floor(Math.random() * 360);
            mainText.style.color = `hsl(${hue}, 100%, 70%)`;
        }, 3000);
    </script>
</body>
</html>
